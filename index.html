<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Máy tính">
  <title>Máy tính ghi lịch sử</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <section class="screen" id="tableScreen" hidden>
    <header class="screen-head table-head">
      <button type="button" id="tableProducts" class="tool-chip">Danh sách</button>
      <button type="button" id="tableNew" class="tool-chip" aria-label="Tạo bảng mới">+</button>
      <button type="button" id="toCalc" class="tool-chip">Máy tính</button>
      <button type="button" id="tableSave" class="tool-chip on">Lưu</button>
    </header>
    <h2 class="table-title" id="tableTitle">Bảng</h2>
    <div class="table-tools"><button type="button" id="detailToggle" class="tool-chip" aria-pressed="false">Chi tiết: Tắt</button></div>
    <div class="grid-wrap"><table class="grid" id="grid"></table></div>
    <div class="total-box">
      <span class="total-label">TỔNG</span>
      <span id="totalVal"></span>
      <div class="total-row">
        <span>Đã trả</span>
        <input type="text" inputmode="decimal" id="paidInput" class="paid-input" placeholder="0" aria-label="Số tiền đã trả">
      </div>
      <div class="total-row">
        <span>Còn lại</span>
        <span id="leftVal"></span>
      </div>
    </div>
  </section>

  <section class="screen" id="productScreen" hidden>
    <header class="screen-head">
      <h2>Danh sách</h2>
      <button type="button" id="productBack" class="tool-chip">Quay lại</button>
    </header>
    <div class="list-tools">
      <input type="search" id="productSearch" class="search-input" placeholder="Tìm tên, ghi chú, số tiền" autocomplete="off">
      <button type="button" id="productAdd" class="tool-chip" aria-label="Sản phẩm mới">+</button>
    </div>
    <ul class="list product-list" id="productList"></ul>
    <p class="empty" id="productEmpty" hidden>Chưa có sản phẩm nào. Lập bảng rồi bấm Lưu để lưu lại.</p>
    <p class="empty" id="productNoMatch" hidden>Không có sản phẩm nào khớp với tìm kiếm.</p>
  </section>

  <main class="calc" id="calc">
    <section class="card" id="card" hidden>
      <div class="card-head">
        <button type="button" id="cardBack" class="tool-chip">‹ Bảng</button>
        <span class="card-title" id="cardTitle"></span>
      </div>
      <div class="card-rows" id="cardRows"></div>
    </section>
    <section class="display" aria-live="polite">
      <div class="toolbar" role="toolbar" aria-label="Tùy chọn hiển thị">
        <button type="button" id="openTable" class="tool-chip">Bảng</button>
        <button type="button" id="editToggle" class="tool-chip" aria-pressed="false">Sửa: Tắt</button>
        <button type="button" id="caretLeft" class="tool-chip arrow" hidden aria-label="Con trỏ sang trái">◀</button>
        <button type="button" id="caretRight" class="tool-chip arrow" hidden aria-label="Con trỏ sang phải">▶</button>
        <label class="tool-select">Thập phân
          <select id="decimals" aria-label="Số chữ số sau dấu thập phân">
            <option value="auto">Tự động</option>
            <option value="0">0</option>
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option>
            <option value="6">6</option>
          </select>
        </label>
      </div>
      <div class="main" id="main">0</div>
      <div class="sub" id="sub"></div>
    </section>
    <section class="keys" id="keys" aria-label="Bàn phím"></section>
  </main>

  <div class="overlay" id="history" hidden>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="histTitle">
      <header>
        <h2 id="histTitle">Lịch sử</h2>
        <div class="sheet-actions">
          <button type="button" id="clearAll" class="text-btn">Xóa tất cả</button>
          <button type="button" id="closeHist" class="text-btn">Đóng</button>
        </div>
      </header>
      <div class="tools">
        <input type="search" id="search" class="search-input" placeholder="Tìm theo ghi chú, biểu thức hoặc kết quả" autocomplete="off">
        <div class="tool-row">
          <button type="button" id="exportBtn" class="text-btn">Xuất JSON</button>
          <button type="button" id="importBtn" class="text-btn">Nhập JSON</button>
          <input type="file" id="importFile" accept=".json,application/json" hidden>
        </div>
      </div>
      <ul class="list" id="list"></ul>
      <p class="empty" id="empty" hidden>Chưa có phép tính nào được lưu.</p>
      <p class="empty" id="noMatch" hidden>Không có mục nào khớp với tìm kiếm.</p>
    </div>
  </div>

  <div class="overlay" id="noteSheet" hidden>
    <div class="sheet note-sheet" role="dialog" aria-modal="true" aria-labelledby="noteTitle">
      <header>
        <h2 id="noteTitle">Lưu phép tính</h2>
        <div class="sheet-actions">
          <button type="button" id="noteCancel" class="text-btn">Hủy</button>
          <button type="button" id="noteOk" class="text-btn strong">Lưu</button>
        </div>
      </header>
      <div class="note-preview" id="notePreview"></div>
      <label class="note-label" for="nameInput">Tên sản phẩm (bắt buộc khi lưu bảng)</label>
      <input type="text" id="nameInput" class="note-input" maxlength="60" autocomplete="off" placeholder="Ví dụ: Túi PE 35x15x28">
      <label class="note-label" for="noteInput">Ghi chú (không bắt buộc)</label>
      <input type="text" id="noteInput" class="note-input" maxlength="200" autocomplete="off" placeholder="Ví dụ: Hộp giấy đơn hàng A">
    </div>
  </div>

  <div class="overlay" id="specSheet" hidden>
    <div class="sheet note-sheet" role="dialog" aria-modal="true" aria-labelledby="specTitle">
      <header>
        <h2 id="specTitle">Q. Cách</h2>
        <div class="sheet-actions">
          <button type="button" id="specCancel" class="text-btn">Hủy</button>
          <button type="button" id="specOk" class="text-btn strong">Lưu</button>
        </div>
      </header>
      <label class="note-label" for="specInput" id="specLabel">Quy cách (D x R x C)</label>
      <input type="text" id="specInput" class="note-input" maxlength="40" autocomplete="off" placeholder="Ví dụ: 35 x 15 x 28">
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
